<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KJGG2</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2c3e50);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .container {
      display: flex;
      gap: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      width: 200px;
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: white;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.2);
    }

    .card h2 {
      margin-bottom: 10px;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <h1 id="title">LOADING PLEASE WAIT....</h1>
  <p>NO ADS</p>

  <div class="container">
    <a class="card" href="iready-cont/cont-index.html">
      <h2 id="b">LOADING PLEASE WAIT....</h2>
      <p id="buttondesc">LOADING PLEASE WAIT....</p>
    </a>
  </div>
  <footer>
    © 2026 DJ Junior
  </footer>
  <script>
    title = document.getElementById("title")
    bdesc = document.getElementById("buttondesc")
    b = document.getElementById("b")
    bdesc2 = document.getElementById("2buttondesc")
    b2 = document.getElementById("2b")
    setText();
    async function setText() {
      await wait(1100);
      title.textContent = "KJ Greatest Games 2 (Unfinished)"
      bdesc.textContent = "Play unblocked games with no ads or lag"
      b.textContent = "🎮 Play"
    }
    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }
  </script>
</body>
</html>
